name: VS Code extension

on:
  pull_request:
  push:
    branches: [main]
    tags: ['extension-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Marketplace and GitHub (select an extension-v tag)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editor-extension/package-lock.json
      - run: npm ci
        working-directory: editor-extension
      - name: Validate release metadata
        run: node scripts/check-extension-release.js
      - name: Validate release tag and main ancestry
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          node scripts/check-extension-release.js "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - name: Test repository and extension
        run: node --test test/*.test.js mcp/test/*.test.js editor-extension/test/*.test.js
      - name: Package extension
        run: npm run package
        working-directory: editor-extension
      - name: Inspect package and write checksum
        run: |
          python3 scripts/check-vsix.py editor-extension/*.vsix
          cd editor-extension
          sha256sum ./*.vsix > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-vsix
          path: |
            editor-extension/*.vsix
            editor-extension/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  integration:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editor-extension/package-lock.json
      - run: npm ci
        working-directory: editor-extension
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-vsix
          path: dist
      - name: Extract the packaged extension
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          unzip -q '*.vsix' -d unpacked
      - name: Test the packaged extension in VS Code
        run: xvfb-run -a npm run test:integration
        working-directory: editor-extension
        env:
          EXTENSION_PATH: ${{ github.workspace }}/dist/unpacked/extension

  publish:
    needs: [build, integration]
    if: >-
      startsWith(github.ref, 'refs/tags/extension-v') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
        working-directory: editor-extension
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-vsix
          path: dist
      - name: Verify artifact
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          python3 ../scripts/check-vsix.py ./*.vsix
      - name: Publish to Visual Studio Marketplace
        working-directory: editor-extension
        run: ./node_modules/.bin/vsce publish --oidc --packagePath ../dist/*.vsix

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-vsix
          path: dist
      - name: Verify checksum
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Create GitHub release with the same VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.vsix dist/SHA256SUMS \
            --verify-tag --title "kanko $RELEASE_TAG" --generate-notes
